# DEPRECATED (lihat docker/nginx/default.conf).
# Port 9002 di host sekarang sudah HTTP (service `web` / nginx di container),
# jadi vhost ini tidak dipakai lagi. Dokumen disimpan hanya sebagai referensi
# bila suatu saat ingin menaruh nginx di depan container.
#
# Salin ke: /etc/nginx/sites-available/mcu.conf  lalu:
#   sudo ln -s /etc/nginx/sites-available/mcu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name mcu.local;

    # Source code di-mount dari host, jadi nginx bisa baca file statis langsung
    root /Users/admin/Project/mcu/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        fastcgi_pass 127.0.0.1:9002;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

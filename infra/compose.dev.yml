name: mcu-base

services:
  mysql:
    image: mysql:8.4
    profiles: ["restore"]
    restart: "no"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_check_up}
      MYSQL_USER: ${MYSQL_USER:-mcu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - "../db/12 oktober_medical_check_up_2026-10-17_000004.sql.gz:/docker-entrypoint-initdb.d/10-legacy.sql.gz:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-mcu}
      POSTGRES_USER: ${POSTGRES_USER:-mcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}
      # Nama role login PostgREST; `mcu_authenticator` agar tidak bentrok dengan
      # role `authenticator` milik platform terkelola (Supabase).
      PGRST_AUTH_ROLE: ${PGRST_AUTH_ROLE:-mcu_authenticator}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?AUTHENTICATOR_PASSWORD wajib}
      MCU_AUTH_PASSWORD: ${MCU_AUTH_PASSWORD:?MCU_AUTH_PASSWORD wajib}
      MCU_SERVICE_PASSWORD: ${MCU_SERVICE_PASSWORD:?MCU_SERVICE_PASSWORD wajib}
      MCU_ADMIN_PASSWORD: ${MCU_ADMIN_PASSWORD:?MCU_ADMIN_PASSWORD wajib}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db:/db:ro
      - ../db/bootstrap/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v16.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${PGRST_AUTH_ROLE:-mcu_authenticator}:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcu}
      # BFF Astro memanggil view di schema `api` dan tabel di schema `public`
      # (lihat docs/RECODE_TO_ASTRO_VUE_POSTGREST.md 6.1). Hak akses tetap
      # dibatasi grant + RLS; `public.users` sudah di-revoke dari authenticated.
      PGRST_DB_SCHEMAS: api,public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib, samakan dengan apps/web/.env}
      PGRST_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${POSTGREST_PORT:-3001}:3000"

  # One-shot ETL: baca MySQL (sudah direstore) lalu tulis ke PostgreSQL.
  # Jalankan dengan:
  #   docker compose --env-file infra/.env -f infra/compose.dev.yml \
  #     --profile restore run --rm etl
  etl:
    profiles: ["restore"]
    build:
      context: ..
      dockerfile: infra/etl/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: mcu_admin
      PGPASSWORD: ${MCU_ADMIN_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mcu}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-mcu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_check_up}
    command: ["--truncate"]
    restart: "no"

volumes:
  mysql_data: {}
  pg_data: {}
